[project]
name = "uaid"
version = "1.3.0"
description = "Identify crawlers and bots by user agent with plain substring matching"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = [
    "bot-detection",
    "crawler-detection",
    "user-agent",
    "user-agent-parser",
    "crawler",
    "bot",
    "spider",
    "web-scraping",
    "scraper-detection",
    "anti-bot",
    "ai-crawler",
    "googlebot",
    "robots",
    "seo",
    "reverse-dns",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: Log Analysis",
    "Topic :: Security",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/tn3w/uaid"

[dependency-groups]
dev = ["pytest", "pytest-cov"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "crawlers.json" },
    { file = "crawler-ips.json" },
    { file = "browsers.json" },
    { file = "hatch_build.py" },
]

[tool.pytest.ini_options]
addopts = "--cov=uaid --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.ruff]
line-length = 90

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
