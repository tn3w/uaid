name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uvx ruff check
      - run: uvx ruff format --check
      - run: >-
          curl -sSfL -o tests/browsers.txt
          https://raw.githubusercontent.com/tn3w/Crawlerdex/master/tools/browser_uas.txt
      - run: uv run pytest
