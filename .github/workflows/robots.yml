name: Robots

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  robots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - run: gh release download robots -p robots-history.json
      - run: curl -fsSLo top.zip https://tranco-list.eu/top-1m.csv.zip
      - run: unzip -p top.zip | node .github/robots.mjs
        env:
          UV_THREADPOOL_SIZE: 128
      - run: gh release upload robots robots-*.json --clobber
