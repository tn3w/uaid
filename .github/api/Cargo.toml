[package]
name = "uaid-api"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "uaid"

[dependencies]
aho-corasick = "1.1.5"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
indexmap = { version = "2.14.2", features = ["serde"] }
listenfd = "1.0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
